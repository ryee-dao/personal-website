<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D · The Sentence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6ead9; --ink:#2a211c; --muted:#77675b; --card:#fffaf2; --line:#e6d5bd; --wire:#cfbda3;
          --clay:#d9623f; --sage:#5f8257; --honey:#b9801a; --plum:#8a5a7c; --tint:var(--bg); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1714; --ink:#f3e9dc; --muted:#a99a8b; --card:#27211c; --line:#3b322a; --wire:#574a3e;
            --clay:#f08a68; --sage:#9dbb95; --honey:#f0c060; --plum:#cf9fc0; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--tint); color:var(--ink); font:17px/1.6 ui-sans-serif,system-ui,sans-serif; min-height:100vh; transition:background .5s; }
  body[data-room="listings"] { --tint:color-mix(in srgb,var(--sage) 16%,var(--bg)); --c:var(--sage); }
  body[data-room="break"]    { --tint:color-mix(in srgb,var(--clay) 14%,var(--bg)); --c:var(--clay); }
  body[data-room="dance"]    { --tint:color-mix(in srgb,var(--honey) 18%,var(--bg)); --c:var(--honey); }
  body[data-room="about"], body[data-room="contact"] { --tint:color-mix(in srgb,var(--plum) 12%,var(--bg)); --c:var(--plum); }
  .wrap { max-width:1080px; margin:0 auto; padding:0 16px 48px; }
  .top { padding:14px 0; font-size:14px; } .top a { color:var(--muted); text-decoration:none; }

  .sentence { font-family:"Bricolage Grotesque",sans-serif; font-weight:700; line-height:1.22; font-size:clamp(30px,5.6vw,62px);
              margin:6vh 0 5vh; max-width:20ch; text-wrap:balance; transition:font-size .4s, margin .4s; }
  body[data-room] .sentence { font-size:clamp(20px,2.6vw,28px); margin:8px 0 20px; max-width:none; }
  .sentence button { font:inherit; color:var(--k); background:none; border:0; padding:0 .08em; margin:0; cursor:pointer; border-radius:.2em;
                     text-decoration:underline; text-decoration-thickness:.09em; text-underline-offset:.14em; text-decoration-style:wavy; }
  .sentence button:hover, .sentence button:focus-visible { background:color-mix(in srgb,var(--k) 16%,transparent); outline:none; }
  .sentence button[aria-pressed="true"] { background:var(--k); color:var(--bg); text-decoration:none; }
  .small { display:block; font-size:.5em; font-weight:500; color:var(--muted); margin-top:.9em; }
  body[data-room] .small { display:inline; margin:0 0 0 .5em; font-size:.8em; }
  .small button { text-decoration-style:solid; }

  .nudge { color:var(--muted); font-size:18px; }
  body[data-room] .nudge { display:none; }

  .room { display:none; gap:16px; }
  body[data-room] .room { display:grid; animation:in .4s ease; }
  @keyframes in { from { opacity:0; transform:translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { body, .sentence { transition:none; } body[data-room] .room { animation:none; } }
  @media (min-width:900px) { .room { grid-template-columns:300px 1fr; align-items:start; } }
  .story { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:22px; }
  .story h2 { font-family:"Bricolage Grotesque",sans-serif; font-size:26px; margin:0 0 10px; line-height:1.15; }
  .story p { margin:0 0 10px; color:var(--muted); }
  .stage { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:16px; border-top:6px solid var(--c); }
  .wire { border:2px dashed var(--wire); border-radius:14px; color:var(--muted); font-size:14px; display:grid; place-items:center; text-align:center; padding:16px; min-height:56vh; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← skeletons</a></div>

  <h1 class="sentence">
    Hi, I'm [YOUR NAME]. I build things that
    <button style="--k:var(--sage)" data-room="listings">watch the housing market</button>,
    <button style="--k:var(--clay)" data-room="break">make you take a break</button>, and
    <button style="--k:var(--honey)" data-room="dance">judge your dancing</button>.
    <span class="small">
      <button style="--k:var(--plum)" data-room="about">More about me</button> or
      <button style="--k:var(--plum)" data-room="contact">say hello</button>.
    </span>
  </h1>
  <p class="nudge">Tap any underlined bit. That's the whole site.</p>

  <section class="room" aria-live="polite">
    <div class="story"><h2 id="t"></h2><p id="s"></p><p id="l"></p></div>
    <div class="stage"><div class="wire" id="w"></div></div>
  </section>
</div>

<script>
  const rooms = {
    listings: ['Real estate listings scraper', 'Why I built it: a few sentences.', 'What I learned: one honest line.', 'Filters · two charts (price trend, price per sq ft) · sortable table of sample listings'],
    break:    ['Break enforcer', 'Why I built it: a few sentences.', 'What I learned: one honest line.', '20s work timer → break overlay takes over the screen, countdown, "demo: skip"'],
    dance:    ['Dance game', 'Why I built it: a few sentences.', 'What I learned: one honest line.', 'Target pose · webcam + skeleton overlay (or keyboard mode) · score · generated beat'],
    about:    ['About me', 'TODO: short, warm, first person.', '', 'Photo + a couple of paragraphs'],
    contact:  ['Say hello', 'Email is the easiest way to reach me.', '', '[EMAIL] · GitHub · LinkedIn'],
  };
  const buttons = document.querySelectorAll('.sentence button');
  const show = (key) => {
    if (!rooms[key]) { delete document.body.dataset.room; key = null; }
    else {
      const [t, s, l, w] = rooms[key];
      document.body.dataset.room = key;
      document.getElementById('t').textContent = t;
      document.getElementById('s').textContent = s;
      document.getElementById('l').textContent = l;
      document.getElementById('w').textContent = w;
    }
    buttons.forEach((b) => b.setAttribute('aria-pressed', b.dataset.room === key));
  };
  buttons.forEach((b) => b.addEventListener('click', () => {
    const next = document.body.dataset.room === b.dataset.room ? '' : b.dataset.room;
    history.pushState(null, '', next ? '#' + next : location.pathname);
    show(next);
  }));
  const fromHash = () => show(location.hash.slice(1));
  addEventListener('popstate', fromHash);
  fromHash();
</script>
</body>
</html>
