<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 · My Day, Fixed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sk.css">
<style>
  body { min-height:100vh; }
  .wrap { display:flex; flex-direction:column; min-height:100vh; padding-bottom:20px; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:14px 24px; flex-wrap:wrap; padding:0 0 16px; }
  .head h1 { font-size:clamp(24px,3.4vw,38px); max-width:19ch; }
  .switch { display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px; position:relative; }
  .switch button { border:0; background:none; padding:10px 22px; border-radius:999px; font-weight:700; font-size:17px; color:var(--muted); transition:background .3s, color .3s; }
  .switch button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  body[data-mode="before"] .switch { animation:nudge 1.6s ease-in-out 3; } @keyframes nudge { 50% { box-shadow:0 0 0 6px color-mix(in srgb,var(--pink) 35%,transparent); } }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
  .stat { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .stat .num { font-size:clamp(26px,4vw,40px); display:block; transition:color .4s; } .stat span:last-child { font-size:13px; color:var(--muted); }
  body[data-mode="before"] .stat .num { color:var(--pink); } body[data-mode="after"] .stat .num { color:var(--mint); }
  @media (max-width:640px) { .stats { grid-template-columns:1fr 1fr; } }

  .scene { flex:1; display:grid; gap:12px; margin-bottom:16px; }
  @media (min-width:860px) { .scene { grid-template-columns:1fr 1.4fr; } }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:8px; min-height:210px; }
  .panel h2 { font-size:clamp(22px,3vw,30px); } .panel p { margin:0; color:var(--muted); }
  .who { display:flex; gap:12px; align-items:end; margin-top:auto; } .who svg { width:64px; flex:none; }
  .right { border-top:5px solid var(--c,var(--line)); transition:border-color .4s; justify-content:center; }
  .right .quote { font-family:Caveat,cursive; font-size:clamp(28px,4vw,44px); line-height:1.1; color:var(--muted); text-align:center; }
  .right .wire { flex:1; min-height:150px; border-color:var(--c); }

  .day { position:relative; }
  .bar { display:flex; height:38px; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .bar i { flex:0 0 0; min-width:0; transition:flex-grow .9s cubic-bezier(.5,0,.2,1), background .9s, opacity .3s; opacity:.5; } .bar i.on { opacity:1; }
  body[data-mode="after"] .bar i.ticks { background-image:repeating-linear-gradient(90deg,transparent 0 22px,var(--bg) 22px 25px); }
  .day input { position:absolute; inset:-6px 0; width:100%; height:50px; margin:0; opacity:0; cursor:ew-resize; }
  .pin { position:absolute; top:-7px; bottom:-7px; width:4px; margin-left:-2px; background:var(--ink); border-radius:2px; pointer-events:none; }
  .hours { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:7px; }
</style>
</head>
<body data-mode="before">
<div class="wrap">
  <nav><a href="index.html">← all designs</a><a href="#">say hello</a></nav>
  <div class="head">
    <h1>I'm [YOUR NAME]. This was my day. Then I built some software.</h1>
    <div class="switch" role="group" aria-label="Before or after my software">
      <button data-m="before" aria-pressed="true">Before</button><button data-m="after" aria-pressed="false">After</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><span class="num" data-b="16" data-a="9" data-u="h">16h</span><span>at my desk</span></div>
    <div class="stat"><span class="num" data-b="0" data-a="11" data-u="">0</span><span>breaks taken</span></div>
    <div class="stat"><span class="num" data-b="0" data-a="1" data-u="">0</span><span>workouts</span></div>
    <div class="stat"><span class="num" data-b="41" data-a="1" data-u="">41</span><span>listing tabs open</span></div>
  </div>

  <div class="scene">
    <div class="panel"><span class="label" id="clock"></span><h2 id="title"></h2><p id="line"></p><div class="who"><svg id="guy"></svg></div></div>
    <div class="panel right" id="right"></div>
  </div>

  <div class="day"><div class="bar" id="bar"></div><div class="pin" id="pin"></div><input type="range" id="t" min="0" max="1439" value="810" aria-label="Time of day"></div>
  <div class="hours"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>12 AM</span></div>
</div>
<script src="sk.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  // each stretch of the day: hours and colour in each version, then [title, line, pose, demo or quote]
  const segs = [
    { b: 2, a: 0, cb: '--pink',  ca: '--pink',  before: ['1 AM. Still working.', 'Nobody asked me to.', 'type', '"just one more thing."'] },
    { b: 6, a: 7, cb: '--blue',  ca: '--blue',  before: ['Asleep, briefly.', '', 'sleep', '"z z z"'], after: ['Asleep. On time.', '', 'sleep', '"z z z"'] },
    { b: 1, a: 2, cb: '--amber', ca: '--amber', before: ['New desk again.', 'Every other month I move between Pennsylvania and Virginia.', 'idle', '"which state is this?"'], after: ['New desk again.', 'Every other month I move between Pennsylvania and Virginia. I\'m good at starting over.', 'idle', '"which state is this?"'] },
    { b: 11, a: 9, cb: '--pink', ca: '--pink', ticks: true, before: ['Eleven hours. No breaks.', 'I\'m a workaholic. Reminders didn\'t work because I ignored them.', 'type', '"I\'ll stretch later."'], after: ['Work, with breaks I can\'t skip.', 'I built a break enforcer: a window that grows until it covers my screen.', 'type', ['Break enforcer', 'Live demo: timer → growing window → full-screen break']] },
    { b: 0, a: 1, cb: '--mint',  ca: '--mint',  after: ['A workout I don\'t dread.', 'I built a dance coach that finds the beat of any song and makes up a routine.', 'dance', ['Dance coach', 'Live demo: the coach dancing · NOW and NEXT move cards']] },
    { b: 0, a: 1, cb: '--amber', ca: '--amber', after: ['Dinner. Laptop closed.', '', 'idle', '"this is nice, actually."'] },
    { b: 3, a: 1, cb: '--yellow', ca: '--yellow', before: ['41 tabs of house listings.', 'I wanted an investment property and was comparing them by memory.', 'look', '"which one was the cheap one?"'], after: ['Ten minutes with the listings.', 'I built a scraper that collects the whole market into one table. Sample data on this site.', 'look', ['Listings scraper', 'Live demo: filters · price per sq ft · price history']] },
    { b: 0, a: 2, cb: '--amber', ca: '--amber', after: ['Off. Actually off.', '', 'idle', '"huh. free time."'] },
    { b: 1, a: 1, cb: '--pink',  ca: '--blue',  before: ['Back at the laptop.', 'See 1 AM.', 'type', '"just one more thing."'], after: ['Asleep.', '', 'sleep', '"z z z"'] },
  ];
  segs.forEach((s) => { s.el = document.createElement('i'); if (s.ticks) s.el.className = 'ticks'; $('bar').append(s.el); });
  const draw = makeGuy($('guy')); let mode = 'before', pose = 'idle', shown = '';
  const scene = () => {
    const m = +$('t').value, h = m / 60, key = mode === 'before' ? 'b' : 'a';
    let acc = 0, s = segs.find((x) => (acc += x[key]) > h) || segs[segs.length - 1];
    const hh = Math.floor(h) % 12 || 12; $('clock').textContent = hh + ':' + String(m % 60).padStart(2, '0') + (h < 12 ? ' AM' : ' PM') + ' · ' + mode;
    $('pin').style.left = m / 1440 * 100 + '%';
    segs.forEach((x) => x.el.classList.toggle('on', x === s));
    const id = mode + segs.indexOf(s); if (id === shown) return; shown = id;
    const [title, line, p, extra] = s[mode]; pose = p; $('title').textContent = title; $('line').textContent = line;
    $('right').style.setProperty('--c', Array.isArray(extra) ? `var(${s.ca})` : 'var(--line)');
    $('right').innerHTML = Array.isArray(extra) ? `<span class="label">${extra[0]}</span><div class="wire">${extra[1]}</div>` : `<div class="quote">${extra}</div>`;
  };
  const setMode = (m) => {
    mode = m; document.body.dataset.mode = m;
    document.querySelectorAll('.switch button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === m));
    segs.forEach((s) => { s.el.style.flexGrow = m === 'before' ? s.b : s.a; s.el.style.background = `var(${m === 'before' ? s.cb : s.ca})`; });
    document.querySelectorAll('.stat .num').forEach((n) => { const from = parseFloat(n.textContent), to = +(m === 'before' ? n.dataset.b : n.dataset.a), t0 = performance.now();
      const f = (t) => { const k = Math.min(1, (t - t0) / 800); n.textContent = Math.round(from + (to - from) * k) + n.dataset.u; if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); });
    shown = ''; scene();
  };
  document.querySelectorAll('.switch button').forEach((b) => b.onclick = () => setMode(b.dataset.m));
  $('t').addEventListener('input', scene);
  setMode(location.hash === '#after' ? 'after' : 'before');
  const loop = (ts) => { draw(pose, ts / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
</script>
</body>
</html>
