<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I · He Builds It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f8f0e3; --card:#fffaf2; --ink:#2a211c; --muted:#77675b; --line:#e6d8c2; --wire:#cfbda3;
          --clay:#d9623f; --sage:#6c9163; --honey:#e0a528; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1714; --card:#27211c; --ink:#f3e9dc; --muted:#a99a8b; --line:#3b322a; --wire:#574a3e;
            --clay:#f08a68; --sage:#9dbb95; --honey:#f0c060; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 ui-sans-serif,system-ui,sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .hand { font-family:Caveat,cursive; }
  svg { overflow:visible; display:block; }
  .d * { stroke:var(--ink); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; fill:none; }
  .d .face { fill:var(--card); } .d .dot { fill:var(--ink); stroke:none; } .d .thin { stroke-width:3; }
  .d .c1 { fill:var(--clay); } .d .c2 { fill:var(--honey); } .d .c3 { fill:var(--sage); }

  #stage { position:fixed; inset:0; touch-action:none; user-select:none; -webkit-user-select:none; }
  #floor { position:absolute; left:0; right:0; border-top:4px solid var(--ink); border-radius:2px; }
  .top { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:12px 16px; font-size:14px; z-index:6; }
  .top a, .top button { color:var(--muted); text-decoration:none; background:none; border:0; padding:0; margin-left:14px; }
  .top a.pulse { color:var(--clay); font-weight:700; animation:pulse 1s infinite; } @keyframes pulse { 50% { opacity:.4; } }

  #headline { position:absolute; top:11vh; left:0; right:0; margin:0 auto; padding:0 16px; max-width:820px; text-align:center;
              font-family:"Bricolage Grotesque",sans-serif; font-weight:700; line-height:1.1; font-size:clamp(26px,4.8vw,50px); text-wrap:balance;
              transform:translateX(-110vw); }
  #headline.in { transform:none; transition:transform .9s cubic-bezier(.3,.9,.4,1); }
  #headline span { color:var(--clay); }
  #hint { position:absolute; left:0; right:0; bottom:10px; text-align:center; color:var(--muted); font-size:clamp(18px,2.4vw,22px); line-height:1.2; opacity:0; transition:opacity .5s; padding:0 12px; }
  #hint.in { opacity:1; }

  #guy { position:absolute; width:80px; height:130px; cursor:grab; z-index:4; transform-origin:50% 100%; }
  #bubble { position:absolute; z-index:5; background:var(--card); border:3px solid var(--ink); border-radius:18px; padding:6px 14px; font-size:23px; line-height:1.15;
            max-width:min(260px,70vw); text-align:center; transform:translate(-50%,-100%); opacity:0; transition:opacity .2s; pointer-events:none; }
  #bubble.on { opacity:1; }
  .obj { position:absolute; left:0; top:0; width:var(--s); height:var(--s); padding:0; border:0; background:none; cursor:grab; z-index:3; touch-action:none; }
  .obj:focus-visible, #guy:focus-visible { outline:3px solid var(--clay); outline-offset:6px; border-radius:12px; }
  .obj.done::after { content:"✓"; position:absolute; right:-4px; top:-10px; font-weight:700; color:var(--sage); font-size:20px; }

  #card { position:absolute; z-index:7; top:9vh; left:50%; width:min(540px,calc(100vw - 24px)); transform:translate(-50%,-20px); opacity:0; pointer-events:none;
          background:var(--card); border:3px solid var(--ink); border-radius:24px; padding:20px; transition:opacity .25s, transform .25s; max-height:62vh; overflow:auto; }
  #card.on { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  #card small { font-family:Caveat,cursive; font-size:22px; color:var(--muted); }
  #card h2 { font-family:"Bricolage Grotesque",sans-serif; font-size:clamp(24px,4vw,32px); line-height:1.1; margin:2px 0 8px; }
  #card p { margin:0 0 12px; color:var(--muted); }
  #card .row { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { background:var(--ink); color:var(--bg); border:0; border-radius:999px; padding:9px 18px; font-weight:600; }
  .btn.ghost { background:none; color:var(--ink); border:2px solid var(--line); }
  .wire { display:none; border:2px dashed var(--wire); border-radius:14px; color:var(--muted); font-size:14px; place-items:center; text-align:center; padding:14px; min-height:150px; margin-top:12px; }
  .wire.on { display:grid; }

  #break { position:fixed; inset:0; z-index:20; background:var(--bg); display:none; place-items:center; text-align:center; padding:24px; }
  #break.on { display:grid; }
  #break h2 { font-family:"Bricolage Grotesque",sans-serif; font-size:clamp(28px,5vw,46px); margin:0; }
  #break .count { font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:80px; color:var(--clay); line-height:1.1; }
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <a href="index.html" style="margin:0">← skeletons</a>
    <span><button id="skip">skip intro</button><button id="replay" hidden>replay</button><a id="hello" href="#">say hello</a></span>
  </div>

  <h1 id="headline">I'm [YOUR NAME]. I build software to fix my own problems. <span>Then other people's.</span></h1>
  <div id="floor"></div>

  <button class="obj" data-k="break" aria-label="Laptop: I can't stop working">
    <svg class="d" viewBox="0 0 84 84"><path class="c1" d="M16 54 v-36 h52 v36 z"/><path d="M6 66 h72 l-8 -12 h-56 z" class="face"/></svg>
  </button>
  <button class="obj" data-k="dance" aria-label="Boombox: I hate home workouts">
    <svg class="d" viewBox="0 0 84 84"><path d="M22 28 v-12 h40 v12"/><path class="c2" d="M8 70 v-42 h68 v42 z"/><circle class="face" cx="27" cy="50" r="11"/><circle class="face" cx="57" cy="50" r="11"/></svg>
  </button>
  <button class="obj" data-k="listings" aria-label="House: where are the good property deals">
    <svg class="d" viewBox="0 0 84 84"><path class="c3" d="M14 74 v-36 l28 -24 l28 24 v36 z"/><path d="M6 42 l36 -30 l36 30"/><path class="face" d="M36 74 v-18 h12 v18"/></svg>
  </button>

  <div id="guy" role="button" tabindex="0" aria-label="The little guy. Pick him up.">
    <svg class="d" viewBox="0 0 80 130">
      <line id="body" x1="40" y1="40" x2="40" y2="84"/>
      <line id="aL"/><line id="aR"/><line id="lL"/><line id="lR"/>
      <circle id="lens" r="9" visibility="hidden"/>
      <circle class="face" id="head" cx="40" cy="22" r="18"/>
      <g id="eyes"><circle class="dot" cx="34" cy="20" r="3"/><circle class="dot" cx="46" cy="20" r="3"/></g>
      <path class="thin" id="shut" d="M30 20 h8 M42 20 h8" visibility="hidden"/>
      <path class="thin" id="mouth" d="M34 29 q6 5 12 0"/>
    </svg>
  </div>
  <div id="bubble" class="hand"></div>

  <div id="card" role="dialog" aria-live="polite">
    <small id="ck"></small><h2 id="ch"></h2><p id="cp"></p>
    <div class="row"><button class="btn" id="demo">Try the demo</button><button class="btn ghost" id="close">Close</button></div>
    <div class="wire" id="cw"></div>
  </div>
  <p id="hint" class="hand">drag things · throw them at him · pick him up · or just tap one</p>
</div>

<div id="break" role="dialog" aria-modal="true" aria-label="Break time">
  <div><h2>Break time. Hands off.</h2><p>On my machine there's no skip button.</p><div class="count" id="count">8</div><button class="btn ghost" id="bskip">demo: skip</button></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const DATA = {
    break:    { k: 'problem 1', h: '"I can\'t stop working."', p: 'So I built a break enforcer that locks me out of my own screen until I\'ve rested.', say: 'this is me at 2am.', pose: 'type', w: '' },
    dance:    { k: 'problem 2', h: '"I hate home workouts."', p: 'So I built a dance game that scores my moves through the webcam. Cardio I don\'t dread.', say: 'this counts as cardio.', pose: 'dance', w: 'Dance game demo: target pose · webcam or keyboard mode · score · generated beat' },
    listings: { k: 'problem 3', h: '"Where are the good property deals?"', p: 'So I built a scraper that turned thousands of listings into a table and charts I could actually read.', say: 'hmm. overpriced.', pose: 'look', w: 'Listings demo: filters · price trend chart · price per sq ft chart · sortable table of sample data' },
  };
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let skip = still || location.search.includes('skip');
  let W, H, floorY, S, built = false, now = 0;
  const used = new Set();

  // ---- the guy ----
  const guy = { x: -60, lift: 0, vy: 0, dir: 1, state: 'idle', target: null, onArrive: null, speed: 1, carrying: null, held: false, a: [0.25, -0.25, 0.12, -0.12] };
  const el = $('guy');
  const pose = (t) => {
    const s = guy.state, d = guy.dir, w = Math.sin(t * 12);
    if (guy.held) return [Math.PI - 0.8 + Math.sin(t * 22) * 0.4, Math.PI + 0.8 - Math.sin(t * 22) * 0.4, 0.5 + w * 0.4, -0.5 - w * 0.4];
    if (s === 'walk') return guy.carrying ? [Math.PI - 0.3, Math.PI + 0.3, w * 0.6, -w * 0.6] : [-w * 0.5, w * 0.5, w * 0.6, -w * 0.6];
    if (s === 'dance') return [Math.PI - 0.6 + Math.sin(t * 8) * 0.5, 1.3 + Math.sin(t * 8 + 1) * 0.6, 0.35 + Math.sin(t * 8) * 0.2, -0.35 + Math.sin(t * 8) * 0.2];
    if (s === 'type') return [d * (1.15 + Math.sin(t * 24) * 0.12), d * (1.0 - Math.sin(t * 24) * 0.12), d * 1.4, d * 1.25];
    if (s === 'look') return [d * 1.35, -d * 0.2, 0.12, -0.12];
    if (s === 'wave') return [Math.PI - 0.5 + Math.sin(t * 16) * 0.4, -0.25, 0.12, -0.12];
    return [0.25, -0.25, 0.12, -0.12];
  };
  const drawGuy = (t, dt) => {
    const want = pose(t), k = Math.min(1, dt * 14);
    guy.a = guy.a.map((v, i) => v + (want[i] - v) * k);
    const sit = guy.state === 'type' ? 34 : 0, bob = guy.state === 'dance' ? Math.abs(Math.sin(t * 8)) * 6 : 0;
    const limb = (id, x, y, ang, L) => { const n = $(id); n.setAttribute('x1', x); n.setAttribute('y1', y); n.setAttribute('x2', x + Math.sin(ang) * L); n.setAttribute('y2', y + Math.cos(ang) * L); return [x + Math.sin(ang) * L, y + Math.cos(ang) * L]; };
    const hand = limb('aL', 40, 50, guy.a[0], 30); limb('aR', 40, 50, guy.a[1], 30); limb('lL', 40, 84, guy.a[2], 40); limb('lR', 40, 84, guy.a[3], 40);
    $('lens').setAttribute('visibility', guy.state === 'look' ? 'visible' : 'hidden'); $('lens').setAttribute('cx', hand[0] + guy.dir * 8); $('lens').setAttribute('cy', hand[1] - 4);
    const asleep = guy.state === 'sleep';
    $('eyes').setAttribute('visibility', asleep ? 'hidden' : 'visible'); $('shut').setAttribute('visibility', asleep ? 'visible' : 'hidden');
    el.style.left = guy.x - 40 + 'px'; el.style.top = floorY - 128 - guy.lift + sit - bob + 'px';
    el.style.transform = asleep ? 'translateY(-16px) rotate(90deg)' : '';
    const b = $('bubble'); b.style.left = Math.max(110, Math.min(W - 110, guy.x)) + 'px'; b.style.top = floorY - 140 - guy.lift + (asleep ? 60 : 0) + 'px';
  };
  let bubbleT;
  const say = (text, ms = 2200) => { const b = $('bubble'); b.textContent = text; b.classList.add('on'); clearTimeout(bubbleT); if (ms) bubbleT = setTimeout(() => b.classList.remove('on'), ms); };
  const wait = (ms) => skip ? Promise.resolve() : new Promise((r) => setTimeout(r, ms));
  const walkTo = (x, speed = 1) => new Promise((r) => {
    if (skip) { guy.x = x; return r(); }
    guy.target = x; guy.speed = speed; guy.state = 'walk'; guy.dir = x > guy.x ? 1 : -1; guy.onArrive = r;
  });

  // ---- throwable objects ----
  const objs = [...document.querySelectorAll('.obj')].map((n, i) => ({ n, k: n.dataset.k, x: -200, y: 0, vx: 0, vy: 0, held: false, slot: [0.13, 0.31, 0.84][i], rest: true }));
  const place = (o) => o.n.style.transform = `translate(${o.x}px,${o.y}px)`;
  const dragify = (node, start, move, end) => {
    let p = null;
    node.addEventListener('pointerdown', (e) => { if (!built) return; p = { x: e.clientX, y: e.clientY, moved: false, trail: [] }; node.setPointerCapture(e.pointerId); start(e); });
    node.addEventListener('pointermove', (e) => {
      if (!p) return;
      if (!p.moved && Math.hypot(e.clientX - p.x, e.clientY - p.y) < 7) return;
      p.moved = true; p.trail.push({ x: e.clientX, y: e.clientY, t: performance.now() }); if (p.trail.length > 5) p.trail.shift(); move(e);
    });
    const up = () => {
      if (!p) return; let vx = 0, vy = 0; const a = p.trail[0], b = p.trail[p.trail.length - 1];
      if (a && b && b.t > a.t) { vx = (b.x - a.x) / (b.t - a.t) * 1000; vy = (b.y - a.y) / (b.t - a.t) * 1000; }
      const moved = p.moved; p = null; end(moved, vx, vy);
    };
    node.addEventListener('pointerup', up); node.addEventListener('pointercancel', up);
  };
  objs.forEach((o) => {
    let off;
    dragify(o.n, (e) => { off = { x: e.clientX - o.x, y: e.clientY - o.y }; },
      (e) => { o.held = true; o.rest = false; o.x = e.clientX - off.x; o.y = e.clientY - off.y; },
      (moved, vx, vy) => { o.held = false; if (moved) { o.vx = vx; o.vy = vy; o.fresh = true; } });
    o.n.addEventListener('click', () => { if (built && !o.wasDrag) fetchAndUse(o); o.wasDrag = false; });
    o.n.addEventListener('pointermove', () => { if (o.held) o.wasDrag = true; });
  });
  let grab;
  dragify(el, (e) => { grab = { x: e.clientX - guy.x, y: e.clientY }; },
    (e) => { if (!guy.held) { guy.held = true; guy.target = null; guy.state = 'idle'; closeCard(); say('hey. HEY.', 0); } guy.x = e.clientX - grab.x; guy.lift = Math.max(0, floorY - e.clientY - 60); },
    (moved) => { if (guy.held) { guy.held = false; guy.vy = 0; guy.falling = true; } else if (!moved && built) say(['yes?', 'that\'s me.', 'pick something up.'][Math.floor(Math.random() * 3)]); });

  // ---- using an object = showing a problem ----
  const closeCard = () => { $('card').classList.remove('on'); $('cw').classList.remove('on'); };
  $('close').onclick = () => { closeCard(); guy.state = 'idle'; };
  let current = null;
  const use = (o, hard) => {
    const d = DATA[o.k]; current = o.k; guy.target = null;
    o.vx = o.vy = 0; o.x = Math.max(4, Math.min(W - S - 4, guy.x + guy.dir * 46 - (guy.dir < 0 ? S : 0))); o.y = floorY - S; o.rest = true; place(o);
    guy.state = d.pose; say(hard ? 'ow. okay, fair.' : d.say);
    o.n.classList.add('done'); used.add(o.k);
    setTimeout(() => { if (current !== o.k) return; $('ck').textContent = d.k; $('ch').textContent = d.h; $('cp').textContent = d.p; $('demo').textContent = o.k === 'break' ? 'Run it on me (10s)' : 'Try the demo'; $('cw').classList.remove('on'); $('card').classList.add('on'); if (used.size === 3) $('hello').classList.add('pulse'); }, 900);
  };
  const fetchAndUse = async (o) => { if (guy.held || o.held) return; closeCard(); const side = o.x + S / 2 > guy.x ? -1 : 1; await walkTo(Math.max(50, Math.min(W - 50, o.x + S / 2 + side * 50))); guy.dir = -side; use(o); };
  $('demo').onclick = () => {
    if (current !== 'break') { $('cw').textContent = DATA[current].w; $('cw').classList.add('on'); return; }
    closeCard(); say('working… 10 seconds.', 0); let n = 10;
    const work = setInterval(() => { n--; say('working… ' + n, 0); if (n > 0) return; clearInterval(work); $('bubble').classList.remove('on'); guy.state = 'sleep';
      let r = 8; $('count').textContent = r; $('break').classList.add('on'); $('bskip').focus();
      const done = () => { clearInterval(rest); $('break').classList.remove('on'); guy.state = 'idle'; say('see? you survived.'); };
      const rest = setInterval(() => { $('count').textContent = --r; if (r <= 0) done(); }, 1000); $('bskip').onclick = done; }, 1000);
  };

  // ---- he reacts to you ----
  let lastInput = 0, lastP = null, wiggle = 0;
  addEventListener('pointermove', (e) => {
    lastInput = now;
    const ang = Math.atan2(e.clientY - (floorY - 108 - guy.lift), e.clientX - guy.x);
    $('eyes').setAttribute('transform', `translate(${Math.cos(ang) * 3} ${Math.sin(ang) * 2.5})`);
    if (lastP) wiggle += Math.hypot(e.clientX - lastP.x, e.clientY - lastP.y); lastP = { x: e.clientX, y: e.clientY };
    if (!built) return;
    if (guy.state === 'sleep' && !$('break').classList.contains('on')) { guy.state = 'idle'; say('I\'m up. I\'m up.'); }
    if (wiggle > 2600 && guy.state === 'idle' && !guy.held && !objs.some((o) => o.held)) { wiggle = 0; guy.state = 'wave'; say('hi!', 1200); setTimeout(() => { if (guy.state === 'wave') guy.state = 'idle'; }, 1300); }
  });
  setInterval(() => wiggle *= 0.5, 400);
  addEventListener('keydown', () => lastInput = now);

  // ---- loop ----
  let prev = performance.now();
  const frame = (ts) => {
    const dt = Math.min(0.033, (ts - prev) / 1000); prev = ts; now = ts / 1000;
    if (guy.target !== null) {
      const step = Math.max(240, W * 0.5) * guy.speed * dt, gap = guy.target - guy.x;
      if (Math.abs(gap) <= step) { guy.x = guy.target; guy.target = null; guy.state = 'idle'; const f = guy.onArrive; guy.onArrive = null; f && f(); }
      else guy.x += Math.sign(gap) * step;
    }
    if (guy.falling) { guy.vy += 2600 * dt; guy.lift -= guy.vy * dt; if (guy.lift <= 0) { guy.lift = 0; guy.falling = false; guy.x = Math.max(40, Math.min(W - 40, guy.x)); say('…rude.'); } }
    if (built && guy.state === 'idle' && !guy.held && now - lastInput > 9) { guy.state = 'sleep'; say('z z z', 0); }
    objs.forEach((o) => {
      if (guy.carrying === o) { o.x = guy.x - S / 2; o.y = floorY - 128 - S + 8; }
      else if (!o.held && !o.rest) {
        o.vy += 2600 * dt; o.x += o.vx * dt; o.y += o.vy * dt;
        if (o.x < 0) { o.x = 0; o.vx *= -0.6; } if (o.x > W - S) { o.x = W - S; o.vx *= -0.6; } if (o.y < 0) { o.y = 0; o.vy *= -0.5; }
        if (o.y >= floorY - S) { o.y = floorY - S; o.vy *= -0.45; o.vx *= 0.8; if (Math.abs(o.vy) < 90) { o.vy = 0; if (Math.abs(o.vx) < 20) { o.rest = true; o.fresh = false; } } }
        const hit = built && o.fresh && !guy.held && Math.abs(o.x + S / 2 - guy.x) < 50 && o.y + S > floorY - 125 - guy.lift;
        if (hit) { o.fresh = false; guy.dir = o.vx > 0 ? -1 : 1; use(o, Math.hypot(o.vx, o.vy) > 1500); }
      }
      place(o);
    });
    drawGuy(now, dt);
    requestAnimationFrame(frame);
  };

  // ---- he builds the site ----
  const layout = () => {
    W = innerWidth; H = innerHeight; S = W < 600 ? 66 : 84; floorY = H - (W < 600 ? 92 : 76);
    document.documentElement.style.setProperty('--s', S + 'px'); $('floor').style.top = floorY + 'px';
    objs.forEach((o) => { if (built || skip) { o.x = Math.max(0, Math.min(W - S, o.x)); o.y = Math.min(o.y, floorY - S); if (o.rest) o.y = floorY - S; } });
  };
  addEventListener('resize', layout);
  const build = async () => {
    // ~2.5s: he runs in pulling the headline, then the three objects drop from the sky
    $('headline').classList.add('in'); if (skip) $('headline').style.transition = 'none';
    await walkTo(W * 0.58, 1.5);
    for (const o of objs) { o.x = Math.max(0, Math.min(W - S, o.slot * W - S / 2)); o.y = -S; o.vx = o.vy = 0; o.rest = false; await wait(160); }
    await wait(650);
    objs.forEach((o) => { if (skip) { o.y = floorY - S; o.rest = true; } });
    built = true; lastInput = now; $('skip').hidden = true; $('replay').hidden = false; $('hint').classList.add('in');
    skip = false; say('hi. three problems I had. throw one at me.', 3600);
  };
  $('skip').onclick = () => { if (built) return; skip = true; guy.target = null; const f = guy.onArrive; guy.onArrive = null; f && f(); };
  $('replay').onclick = () => location.replace(location.pathname);
  layout(); requestAnimationFrame(frame); build();
</script>
</body>
</html>
