<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · The Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --desk:#e9d3b4; --grain:#dfc6a2; --ink:#2a211c; --muted:#6f5f52; --paper:#fffaf2; --line:#d9c7ab; --wire:#cfbda3;
          --clay:#d9623f; --sage:#7f9a78; --honey:#f2cf63; --shadow:0 10px 24px rgba(60,35,10,.22); }
  @media (prefers-color-scheme: dark) {
    :root { --desk:#2b221b; --grain:#33281f; --ink:#f3e9dc; --muted:#b3a393; --paper:#3a3029; --line:#4d4036; --wire:#6a5a4c;
            --clay:#f08a68; --sage:#9dbb95; --honey:#d9b44a; --shadow:0 10px 24px rgba(0,0,0,.5); }
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); font:16px/1.5 ui-sans-serif,system-ui,sans-serif; min-height:100vh;
         background:repeating-linear-gradient(92deg,var(--desk) 0 90px,var(--grain) 90px 93px); }
  h1,h2 { font-family:"Bricolage Grotesque",sans-serif; font-weight:700; margin:0; line-height:1.1; }
  .hand { font-family:Caveat,cursive; }

  .top { display:flex; justify-content:space-between; padding:14px 16px; font-size:14px; }
  .top a { color:var(--muted); text-decoration:none; }

  .desk { position:relative; height:calc(100vh - 50px); min-height:620px; overflow:hidden; }
  .item { position:absolute; border:0; padding:0; background:none; color:inherit; font:inherit; cursor:grab; touch-action:none;
          transform:rotate(var(--r,0deg)); transition:transform .2s, filter .2s; filter:drop-shadow(var(--shadow)); text-align:left; }
  .item:hover, .item:focus-visible { transform:rotate(0deg) scale(1.04); outline:none; }
  .item:focus-visible > * { outline:3px solid var(--clay); outline-offset:4px; }
  .item.dragging { cursor:grabbing; transition:none; z-index:50; }
  .label { display:block; margin-top:8px; font-family:Caveat,cursive; font-size:22px; text-align:center; }

  /* name card */
  .card { width:min(340px,80vw); background:var(--paper); padding:22px 24px; border-radius:6px; }
  .card h1 { font-size:34px; }
  .card p { margin:8px 0 0; color:var(--muted); }
  .card .hand { color:var(--clay); font-size:24px; margin-top:10px; display:block; }

  /* listings printout */
  .sheets { width:210px; height:150px; position:relative; }
  .sheets i { position:absolute; inset:0; background:var(--paper); border:1px solid var(--line); border-radius:3px; }
  .sheets i:nth-child(1) { transform:rotate(-5deg); } .sheets i:nth-child(2) { transform:rotate(3deg); }
  .sheets i:nth-child(3) { padding:14px; display:grid; gap:7px; align-content:start; }
  .sheets b { height:7px; border-radius:4px; background:var(--wire); } .sheets b:first-child { background:var(--sage); width:60%; }

  /* kitchen timer */
  .timer { width:130px; height:130px; border-radius:50%; background:var(--clay); display:grid; place-items:center; margin:0 auto; }
  .timer::after { content:"20s"; width:86px; height:86px; border-radius:50%; background:var(--paper); display:grid; place-items:center;
                  font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:24px; }

  /* dance mat */
  .mat { width:170px; height:170px; background:var(--ink); border-radius:14px; padding:12px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .mat i { border-radius:8px; background:color-mix(in srgb,var(--paper) 18%,transparent); }
  .mat i:nth-child(2) { background:var(--honey); } .mat i:nth-child(4) { background:var(--clay); }
  .mat i:nth-child(6) { background:var(--sage); } .mat i:nth-child(8) { background:var(--paper); }

  /* sticky + postcard */
  .sticky { width:150px; height:150px; background:var(--honey); color:#2a211c; padding:16px; font-family:Caveat,cursive; font-size:24px; line-height:1.15; }
  .post { width:210px; height:135px; background:var(--paper); border:1px solid var(--line); padding:14px; display:grid; grid-template-columns:1fr 46px; gap:10px; }
  .post .hand { font-size:24px; line-height:1.1; } .post i { height:54px; border:2px dashed var(--wire); }

  .hint { position:absolute; bottom:16px; left:0; right:0; text-align:center; font-family:Caveat,cursive; font-size:22px; color:var(--muted); pointer-events:none; }

  /* small screens: a tidy pile instead of free dragging */
  @media (max-width:760px) {
    .desk { height:auto; overflow:visible; display:grid; grid-template-columns:1fr 1fr; gap:28px 12px; padding:8px 16px 80px; justify-items:center; align-items:center; }
    .item { position:static; cursor:pointer; touch-action:auto; }
    .item.wide { grid-column:1 / -1; }
    .sheets, .post { width:150px; height:110px; } .post .hand { font-size:19px; }
    .mat, .sticky { width:130px; height:130px; } .sticky { font-size:20px; }
    .hint { position:static; grid-column:1 / -1; }
  }

  /* the "room" each object opens */
  dialog { border:0; padding:0; width:100vw; height:100vh; max-width:none; max-height:none; background:var(--paper); color:var(--ink); }
  dialog[open] { animation:rise .3s ease; }
  @keyframes rise { from { opacity:0; transform:scale(.96) translateY(20px); } }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation:none; } .item { transition:none; } }
  .room { max-width:1080px; margin:0 auto; padding:20px 16px 40px; display:grid; gap:20px; }
  .room header { display:flex; justify-content:space-between; align-items:center; }
  .room .close { border:1px solid var(--line); background:none; color:inherit; font:inherit; padding:8px 16px; border-radius:999px; cursor:pointer; }
  .room h2 { font-size:clamp(30px,5vw,46px); }
  .room .story { color:var(--muted); max-width:60ch; margin:0; }
  .wire { border:2px dashed var(--wire); border-radius:16px; color:var(--muted); font-size:14px; display:grid; place-items:center; text-align:center; padding:16px; min-height:52vh; }
</style>
</head>
<body>
<div class="top"><a href="index.html">← skeletons</a><span class="hand" style="font-size:20px">drag things around · click to open</span></div>

<main class="desk" id="desk">
  <button class="item wide" style="left:6%;top:6%;--r:-2deg" data-room="about">
    <span class="card">
      <h1>[YOUR NAME]</h1>
      <p>I build automations, internal tools, and websites. This is my desk. Pick something up.</p>
      <span class="hand">↓ everything here works</span>
    </span>
  </button>

  <button class="item" style="left:58%;top:8%;--r:4deg" data-room="listings">
    <span class="sheets"><i></i><i></i><i><b></b><b></b><b></b><b></b><b></b></i></span>
    <span class="label">listings scraper</span>
  </button>

  <button class="item" style="left:40%;top:44%;--r:-3deg" data-room="break">
    <span class="timer"></span>
    <span class="label">break enforcer</span>
  </button>

  <button class="item" style="left:70%;top:50%;--r:6deg" data-room="dance">
    <span class="mat"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="label">dance game</span>
  </button>

  <button class="item" style="left:10%;top:56%;--r:-7deg" data-room="about">
    <span class="sticky">about me<br>(TODO: rewrite)</span>
  </button>

  <button class="item" style="left:22%;top:74%;--r:3deg" data-room="contact">
    <span class="post"><span class="hand">say hello →<br>[EMAIL]</span><i></i></span>
  </button>

  <p class="hint">the real version: each object opens its own page with the live demo</p>
</main>

<dialog id="room">
  <div class="room">
    <header><span class="hand" style="font-size:22px">← back to the desk</span><button class="close" id="close">Close</button></header>
    <h2 id="room-title"></h2>
    <p class="story" id="room-story"></p>
    <div class="wire" id="room-wire"></div>
  </div>
</dialog>

<script>
  const rooms = {
    listings: ['Real estate listings scraper', 'Why I built it and what I learned, a few sentences.', 'Filters · two charts (price trend, price per sq ft) · sortable table of sample listings'],
    break:    ['Break enforcer', 'Why I built it and what I learned, a few sentences.', '20s work timer → break overlay takes over the screen, countdown, "demo: skip"'],
    dance:    ['Dance game', 'Why I built it and what I learned, a few sentences.', 'Target pose · webcam + skeleton overlay (or keyboard mode) · score · generated beat'],
    about:    ['About me', 'TODO: short, warm, first person.', 'Photo + a couple of paragraphs'],
    contact:  ['Say hello', 'Email is the easiest way to reach me.', '[EMAIL] · GitHub · LinkedIn'],
  };
  const dlg = document.getElementById('room');
  const open = (key) => {
    const [t, s, w] = rooms[key];
    document.getElementById('room-title').textContent = t;
    document.getElementById('room-story').textContent = s;
    document.getElementById('room-wire').textContent = w;
    dlg.showModal();
  };
  document.getElementById('close').onclick = () => dlg.close();

  const desk = document.getElementById('desk');
  const free = () => matchMedia('(min-width: 761px)').matches;
  let z = 10;
  document.querySelectorAll('.item').forEach((el) => {
    let start = null, moved = false;
    el.addEventListener('pointerdown', (e) => {
      if (!free()) return;
      const r = el.getBoundingClientRect(), d = desk.getBoundingClientRect();
      start = { x: e.clientX, y: e.clientY, left: el.offsetLeft, top: el.offsetTop, maxX: d.width - 60, maxY: d.height - 60 };
      moved = false;
      el.style.zIndex = ++z;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (!start) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!moved && Math.hypot(dx, dy) < 6) return;
      moved = true;
      el.classList.add('dragging');
      el.style.left = Math.max(-40, Math.min(start.maxX, start.left + dx)) + 'px';
      el.style.top = Math.max(-20, Math.min(start.maxY, start.top + dy)) + 'px';
    });
    const end = () => { start = null; el.classList.remove('dragging'); };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('click', (e) => { if (moved) { moved = false; e.preventDefault(); return; } open(el.dataset.room); });
  });
</script>
</body>
</html>
