<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 · Day Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sk.css">
<style>
  body { transition:background .5s; }
  .wrap { padding-bottom:80px; }
  .intro h1 { font-size:clamp(24px,3.6vw,38px); max-width:24ch; margin:0 0 16px; } .intro h1 em { font-style:normal; color:var(--c); transition:color .4s; }
  /* the day is the menu */
  .day { display:flex; gap:6px; }
  .day button { border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:10px 12px; text-align:left; flex:var(--f) 1 0; min-width:0; border-bottom:5px solid var(--k);
                transition:transform .18s ease-out, box-shadow .2s, background .3s; }
  .day button:hover { box-shadow:0 8px 22px rgba(0,0,0,.25); } .day button:focus-visible { outline:3px solid var(--k); outline-offset:2px; }
  .day button[aria-pressed="true"] { background:color-mix(in srgb,var(--k) 22%,var(--surface)); border-color:var(--k); }
  .day .when { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; display:block; } .day .what { font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:15px; line-height:1.15; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media (max-width:760px) { .day { flex-wrap:wrap; } .day button { flex:1 1 30%; } }

  .stage { display:grid; gap:12px; margin-top:14px; }
  @media (min-width:860px) { .stage { grid-template-columns:320px 1fr; } }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .panel h2 { font-size:clamp(22px,2.8vw,28px); } .panel p { margin:0; color:var(--muted); }
  .flip { display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:4px; align-self:flex-start; }
  .flip button { border:0; background:none; padding:6px 16px; border-radius:999px; font-weight:700; font-size:14px; color:var(--muted); } .flip button[aria-pressed="true"] { background:var(--c); color:var(--bg); }
  .demo { min-height:340px; border-top:5px solid var(--c); transition:border-color .4s; align-items:center; justify-content:center; text-align:center; }
  .demo .quote { font-family:Caveat,cursive; font-size:clamp(30px,5vw,48px); line-height:1.1; color:var(--muted); } .demo svg.guy { width:80px; margin:14px auto 0; }
  .demo .wire { align-self:stretch; flex:1; border-color:var(--c); }
  .ring { position:relative; width:min(210px,56vw); aspect-ratio:1; } .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:10; stroke:var(--line); } .ring .prog { stroke:var(--c); stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  .ring b { position:absolute; inset:0; display:grid; place-items:center; font-family:"Bricolage Grotesque",sans-serif; font-size:52px; font-variant-numeric:tabular-nums; }

  .ticker { position:fixed; left:0; right:0; bottom:0; z-index:5; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line); }
  .ticker div { max-width:1100px; margin:0 auto; padding:8px 84px 8px 16px; display:flex; gap:4px 20px; flex-wrap:wrap; font-size:13px; color:var(--muted); } .ticker b { color:var(--ink); font-variant-numeric:tabular-nums; }
  #pal { position:fixed; right:14px; bottom:6px; width:52px; z-index:6; }
  #say { position:fixed; right:72px; bottom:58px; z-index:6; background:var(--surface); border:2px solid var(--ink); border-radius:14px; padding:2px 12px; font-family:Caveat,cursive; font-size:21px; opacity:0; transition:opacity .2s; pointer-events:none; } #say.on { opacity:1; }
  #over { position:fixed; inset:0; z-index:20; background:var(--bg); display:none; place-items:center; text-align:center; padding:24px; } #over.on { display:grid; }
  #over h2 { font-size:clamp(28px,5vw,44px); } #over .num { font-size:76px; color:var(--pink); display:block; margin:10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="index.html">← all designs</a><a href="#" data-go="6">say hello</a></nav>
  <header class="intro"><h1>I'm [YOUR NAME]. This is my day, and <em>the software I built to fix it.</em></h1></header>
  <div class="day" id="day"></div>
  <div class="stage">
    <div class="panel">
      <span class="label" id="when"></span><h2 id="title"></h2><p id="line"></p>
      <div class="flip" id="flip" role="group" aria-label="Before or after"><button data-m="before">Before</button><button data-m="after">After</button></div>
    </div>
    <div class="panel demo" id="demo"></div>
  </div>
</div>
<div class="ticker"><div><span>here <b id="here">0:00</b></span><span><b id="px">0</b> px moved</span><span><b id="clk">0</b> clicks</span><span><b id="seen">1</b>/3 demos tried</span></div></div>
<svg id="pal"></svg><div id="say"></div>
<div id="over" role="dialog" aria-modal="true" aria-label="Break time"><div><h2>Break time. Hands off.</h2><span class="num" id="count">8</span><button class="btn" id="skip">demo: skip</button></div></div>
<script src="sk.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  // f = width on the day bar. Projects have a before and an after; plain moments just have one line.
  const day = [
    { when: '7 AM', what: 'New desk', f: 1.2, k: '--amber', title: 'Every other month, I move.', line: 'Pennsylvania one month, Virginia the next. New desk, new routine, same work. I\'m good at starting over.', quote: '"which state is this again?"', pose: 'idle' },
    { when: '9 AM – 6 PM', what: 'Work', f: 3.4, k: '--pink', project: 'break', title: 'I can\'t stop working.', line: 'So I built a break enforcer: a window that grows until it covers my screen. One rule: don\'t click stop.', quote: '"just one more thing."', pose: 'type' },
    { when: '6 PM', what: 'Workout', f: 1.4, k: '--mint', project: 'dance', title: 'I hate home workouts.', line: 'So I built a dance coach. It finds the beat of any song and makes up a routine from 2,411 moves.', quote: '"20 burpees. again. no."', pose: 'burpee', wire: 'Live demo: the coach dancing · NOW and NEXT move cards · Chill / Cardio / Sweaty' },
    { when: '7 PM', what: 'Family', f: 1.2, k: '--amber', title: 'Dinner. Laptop closed.', line: 'TODO: one line about what matters outside work.', quote: '"this is nice, actually."', pose: 'idle' },
    { when: '9 PM', what: 'House hunt', f: 1.6, k: '--yellow', project: 'listings', title: 'Where are the good property deals?', line: 'So I built a scraper that collects the whole market into one table. Sample data on this site.', quote: '"which tab was the cheap one?"', pose: 'look', wire: 'Live demo: filters · price per sq ft · price history' },
    { when: '11 PM', what: 'Asleep', f: 1, k: '--blue', title: 'Asleep. On time, lately.', line: 'See 9 AM.', quote: '"z z z"', pose: 'sleep' },
    { when: 'any time', what: 'Say hello', f: 1.2, k: '--mint', title: 'Got a problem like these?', line: '[EMAIL] · GitHub · LinkedIn. TODO: two warm sentences about me.', quote: '"hi."', pose: 'dance' },
  ];
  let cur = 1, mode = 'after', pose = 'type'; const seen = new Set(['break']);
  day.forEach((d, i) => { const b = document.createElement('button'); b.style.cssText = `--f:${d.f};--k:var(${d.k})`; b.innerHTML = `<span class="when">${d.when}</span><span class="what">${d.what}</span>`; b.onclick = () => show(i); $('day').append(b);
    if (matchMedia('(hover: hover)').matches) { b.onpointermove = (e) => { const r = b.getBoundingClientRect(); b.style.transform = `perspective(500px) rotateX(${-((e.clientY - r.top) / r.height - 0.5) * 12}deg) rotateY(${((e.clientX - r.left) / r.width - 0.5) * 10}deg) translateY(-2px)`; }; b.onpointerleave = () => b.style.transform = ''; } });
  document.querySelector('[data-go]').onclick = (e) => { e.preventDefault(); show(6); };

  // break enforcer: really runs while you're looking at it
  const WORK = 20; let left = WORK, armed = true, rest = 0;
  const ringHTML = () => `<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><circle class="prog" id="prog" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="${276.5 * (1 - left / WORK)}"/></svg><b id="secs">${left}</b></div><p id="rmsg">${armed ? 'already running. it takes over the screen at zero.' : 'that\'s the demo. <button class="btn" id="again">Run it again</button>'}</p>`;
  let demoGuy = null;
  const render = () => {
    const d = day[cur], el = $('demo');
    document.body.style.setProperty('--c', `var(${d.k})`); document.body.style.background = `color-mix(in srgb, var(${d.k}) 7%, var(--bg))`;
    [...$('day').children].forEach((b, i) => b.setAttribute('aria-pressed', i === cur));
    $('when').textContent = d.when; $('title').textContent = d.title; $('line').textContent = d.line; $('flip').hidden = !d.project;
    $('flip').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === mode));
    demoGuy = null; pose = d.pose;
    if (d.project && mode === 'after') { el.innerHTML = d.project === 'break' ? ringHTML() : `<div class="wire">${d.wire}</div>`; if ($('again')) $('again').onclick = () => { left = WORK; armed = true; render(); }; }
    else { el.innerHTML = `<div class="quote">${d.quote}</div><svg></svg>`; demoGuy = makeGuy(el.querySelector('svg')); }
  };
  const lines = { break: 'uh oh. the timer.', dance: 'this counts as cardio.', listings: 'ooh, numbers.' };
  const show = (i) => { cur = i; mode = 'after'; const p = day[i].project; if (p) { seen.add(p); $('seen').textContent = seen.size; } render(); say(p ? (seen.size === 3 && !show.done ? (show.done = 1, 'all three! say hello?') : lines[p]) : day[i].quote.replace(/"/g, ''), 'dance'); };
  $('flip').querySelectorAll('button').forEach((b) => b.onclick = () => { mode = b.dataset.m; render(); });

  // corner companion + ticker
  const pal = makeGuy($('pal')); let palPose = 'idle', palT = 0, sayT, lastIn = performance.now(), px = 0, lastP = null, clk = 0, s = 0;
  const say = (t, p = 'idle', ms = 1800) => { $('say').textContent = t; $('say').classList.add('on'); palPose = p; clearTimeout(sayT); sayT = setTimeout(() => { $('say').classList.remove('on'); palPose = 'idle'; }, ms); };
  const wake = () => { if (palPose === 'sleep') say('I\'m up.'); lastIn = performance.now(); };
  addEventListener('pointermove', (e) => { wake(); if (lastP) px += Math.hypot(e.clientX - lastP.x, e.clientY - lastP.y); lastP = { x: e.clientX, y: e.clientY }; $('px').textContent = Math.round(px).toLocaleString(); });
  addEventListener('click', () => { wake(); $('clk').textContent = ++clk; });
  const endBreak = () => { rest = 0; $('over').classList.remove('on'); render(); say('see? you survived.'); };
  $('skip').onclick = endBreak;
  setInterval(() => {
    s++; $('here').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (rest > 0) { $('count').textContent = --rest; if (rest === 0) endBreak(); return; }
    if (!armed || day[cur].project !== 'break' || mode !== 'after') return;
    left--; if ($('secs')) { $('secs').textContent = left; $('prog').style.strokeDashoffset = 276.5 * (1 - left / WORK); }
    if (left <= 0) { armed = false; rest = 8; $('count').textContent = 8; $('over').classList.add('on'); $('skip').focus(); }
  }, 1000);
  const loop = (ts) => { if (palPose === 'idle' && ts - lastIn > 10000) { palPose = 'sleep'; $('say').textContent = 'z z z'; $('say').classList.add('on'); } pal(palPose, ts / 1000); if (demoGuy) demoGuy(pose, ts / 1000); requestAnimationFrame(loop); };
  render(); requestAnimationFrame(loop); setTimeout(() => say('hi. the timer\'s already going.', 'idle', 2600), 600);
</script>
</body>
</html>
