<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L · One Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sk.css">
<style>
  body { min-height:100vh; transition:background .4s; }
  .wrap { display:flex; flex-direction:column; min-height:100vh; padding-bottom:20px; }
  .head { display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; padding:1vh 0 14px; }
  .head h1 { font-size:clamp(24px,3.4vw,38px); max-width:20ch; }
  .clock { font-size:clamp(44px,8vw,84px); color:var(--c); transition:color .4s; }
  .scene { flex:1; display:grid; gap:14px; align-items:stretch; margin-bottom:16px; }
  @media (min-width:860px) { .scene { grid-template-columns:1fr 1.5fr; } }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .panel h2 { font-size:clamp(24px,3.2vw,34px); } .panel p { margin:0; color:var(--muted); }
  .who { display:flex; gap:14px; align-items:end; margin-top:auto; } .who svg { width:74px; flex:none; } .who span { font-size:14px; color:var(--muted); }
  .demo { border-top:5px solid var(--c); transition:border-color .4s; } .demo .wire { flex:1; min-height:230px; }
  /* the day bar */
  .day { position:relative; }
  .bar { display:flex; height:34px; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .bar i { display:block; height:100%; opacity:.45; transition:opacity .3s; } .bar i.on { opacity:1; }
  .day input { position:absolute; inset:-6px 0; width:100%; height:46px; margin:0; opacity:0; cursor:ew-resize; }
  .pin { position:absolute; top:-8px; bottom:-8px; width:4px; margin-left:-2px; background:var(--ink); border-radius:2px; pointer-events:none; }
  .hours { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:8px; }
  .hint { text-align:center; font-size:14px; color:var(--muted); margin:10px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="index.html">← skeletons</a><a href="#" id="hello">say hello</a></nav>
  <div class="head">
    <h1>I'm [YOUR NAME]. This is one day of my life, and the software I built to survive it.</h1>
    <span class="num clock" id="clock">9:00 AM</span>
  </div>

  <div class="scene">
    <div class="panel">
      <span class="label" id="kicker"></span>
      <h2 id="title"></h2>
      <p id="story"></p>
      <div class="who"><svg id="guy"></svg><span id="caption"></span></div>
    </div>
    <div class="panel demo"><span class="label" id="dlabel"></span><div class="wire" id="demo"></div></div>
  </div>

  <div class="day">
    <div class="bar" id="bar"></div><div class="pin" id="pin"></div>
    <input type="range" id="t" min="0" max="1439" value="540" aria-label="Time of day">
  </div>
  <div class="hours"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>12 AM</span></div>
  <p class="hint" id="hint">Drag the day. It's playing on its own until you do.</p>
</div>
<script src="sk.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  // from, to (hours), colour, pose, then copy
  const parts = [
    { a: 0,  b: 7,  c: '--blue',   pose: 'sleep', k: 'Night', t: 'Asleep. Finally.', s: 'TODO: a line about why sleep is a recent development.', cap: 'do not disturb', d: 'About me', w: 'Short bio · the PA ⇄ VA month switch · 2 days to learn Claude Code, 2 weeks to learn Java' },
    { a: 7,  b: 9,  c: '--amber',  pose: 'idle',  k: 'Morning', t: 'New desk. Same job.', s: 'Every other month I move between Pennsylvania and Virginia and rebuild my whole routine. I\'m good at starting over.', cap: 'which state is this again', d: 'Where I am this month', w: 'Month strip: PA / VA alternating, current month marked' },
    { a: 9,  b: 18, c: '--pink',   pose: 'type',  k: 'Problem: I can\'t stop working', t: 'So I built a break enforcer.', s: 'A window that grows until it covers the screen and moves back if you push it away. One rule: don\'t click stop.', cap: 'just one more thing', d: 'Live demo · break enforcer', w: 'Work timer running → window grows → full-screen break, with "demo: skip"' },
    { a: 18, b: 20, c: '--mint',   pose: 'dance', k: 'Problem: I hate home workouts', t: 'So I built a dance coach.', s: 'It listens to any song, finds the beat, and makes up a routine from 2,411 moves. No camera, no score. You just copy it.', cap: 'this counts as cardio', d: 'Live demo · dance coach', w: 'The coach dancing to a generated beat · NOW and NEXT move cards · Chill / Cardio / Sweaty' },
    { a: 20, b: 23, c: '--yellow', pose: 'look',  k: 'Problem: where are the good property deals?', t: 'So I built a listings scraper.', s: 'It checked for-sale, rental and sold listings at random times every day and kept the history. Sample data here; nothing is scraped on this site.', cap: 'overpriced. next.', d: 'Live demo · listings', w: 'Filters · price per sq ft · price-to-rent · one house\'s price history' },
    { a: 23, b: 24, c: '--pink',   pose: 'type',  k: '11 PM', t: 'Back at the laptop. See problem one.', s: 'This is why the break enforcer has no skip button.', cap: 'I know, I know', d: 'Live demo · break enforcer', w: 'Same demo as the workday, already overdue' },
  ];
  parts.forEach((p) => { const i = document.createElement('i'); i.style.cssText = `width:${(p.b - p.a) / 24 * 100}%;background:var(${p.c})`; $('bar').append(i); });
  const draw = makeGuy($('guy')); let cur = -1, pose = 'idle', auto = true;
  const set = (m) => {
    const h = m / 60, idx = parts.findIndex((p) => h >= p.a && h < p.b), p = parts[idx];
    const hh = Math.floor(h) % 12 || 12; $('clock').textContent = hh + ':' + String(Math.floor(m % 60)).padStart(2, '0') + (h < 12 ? ' AM' : ' PM');
    $('pin').style.left = m / 1440 * 100 + '%';
    if (idx === cur) return; cur = idx; pose = p.pose;
    document.body.style.setProperty('--c', `var(${p.c})`);
    document.body.style.background = `color-mix(in srgb, var(${p.c}) ${p.pose === 'sleep' ? 4 : 9}%, var(--bg))`;
    $('kicker').textContent = p.k; $('title').textContent = p.t; $('story').textContent = p.s; $('caption').textContent = p.cap; $('dlabel').textContent = p.d; $('demo').textContent = p.w;
    [...$('bar').children].forEach((n, i) => n.classList.toggle('on', i === idx));
  };
  $('t').addEventListener('input', (e) => { auto = false; $('hint').textContent = 'Drag anywhere along the day.'; set(+e.target.value); });
  let last = 0;
  const loop = (ts) => { if (auto && !matchMedia('(prefers-reduced-motion: reduce)').matches && ts - last > 50) { last = ts; const v = (+$('t').value + 4) % 1440; $('t').value = v; set(v); } draw(pose, ts / 1000); requestAnimationFrame(loop); };
  set(540); requestAnimationFrame(loop);
</script>
</body>
</html>
